services:
  postgres:
    image: postgres:16-alpine
    container_name: helpcrunch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "888"
      POSTGRES_DB: helpcrunch
    ports:
      - "5432:5432"
    volumes:
      - helpcrunch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpcrunch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helpcrunch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - helpcrunch_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  helpcrunch_postgres_data:
  helpcrunch_redis_data:
